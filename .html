
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
  <h1>The Graph</h1>
  <canvas id="chart" width="700" height="400"></canvas>

<script>
  const labels = ["8:00", "8:10", "8:15", "8:20", "8:25"];
  const data   = [16.00, 14.00, 11.00, 15.00, 11.00];
const data   = [6.00, 12.00, 11.00, 15.00, 9.00];
  
  const c = document.getElementById("Wait Time");
  const g = c.getContext("2d");
  const padL = 60, padB = 50, padT = 30, padR = 30;
  const w = c.width - padL - padR;
  const h = c.height - padT - padB;
  const max = Math.max(...data) * 1.1;

  // axes
  g.strokeStyle = "#999";
  g.beginPath();
  g.moveTo(padL, padT);
  g.lineTo(padL, padT + h);
  g.lineTo(padL + w, padT + h);
  g.stroke();

  // points
  const pts = data.map((v, i) => [
    padL + (i * w) / (data.length - 1),
    padT + h - (v / max) * h
  ]);

  // line
  g.strokeStyle = "#FF0145";
  g.lineWidth = 3;
  g.beginPath();
  pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.stroke();

  // dots + labels
  g.fillStyle = "#FF0145";
  pts.forEach(([x, y]) => {
    g.beginPath();
    g.arc(x, y, 4, 0, Math.PI * 2);
    g.fill();
  });
  }
}
</script>
</body>
</html>
